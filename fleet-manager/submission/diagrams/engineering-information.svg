<svg xmlns="http://www.w3.org/2000/svg" width="740" height="550" viewBox="0 0 740 550" role="img"><title>09 / Operator information architecture</title><desc>Task-oriented navigation, not a claim of a new interface implementation.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#426077" stroke-width="1.3"/></marker></defs>
<rect width="740" height="550" rx="14" fill="#f5f8fb"/>
<text x="22" y="31" font-family="Arial, sans-serif" font-size="21" fill="#12344b" font-weight="700" text-anchor="start">09 / Operator information architecture</text>
<text x="22" y="56" font-family="Arial, sans-serif" font-size="13" fill="#365269" font-weight="400" text-anchor="start">Task-oriented navigation, not a claim of a new interface implementation.</text>
<rect x="230" y="85" width="280" height="67" rx="8" fill="#e8f1fa" stroke="#7195b7"/>
<text x="242" y="110" font-family="Arial, sans-serif" font-size="16" fill="#18394e" font-weight="700" text-anchor="start">Authenticated dashboard</text>
<text x="242" y="134" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Password-change gate when required</text>
<rect x="24" y="218" width="210" height="100" rx="8" fill="#e8f1fa" stroke="#7195b7"/>
<text x="36" y="243" font-family="Arial, sans-serif" font-size="16" fill="#18394e" font-weight="700" text-anchor="start">Orient</text>
<text x="36" y="267" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Fleet summary / health</text>
<text x="36" y="288" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Freshness + missing signals</text>
<text x="36" y="309" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Refresh / metrics / Grafana</text>
<rect x="264" y="218" width="210" height="100" rx="8" fill="#e8f1fa" stroke="#7195b7"/>
<text x="276" y="243" font-family="Arial, sans-serif" font-size="16" fill="#18394e" font-weight="700" text-anchor="start">Investigate</text>
<text x="276" y="267" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Inventory / selected node</text>
<text x="276" y="288" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Setup state + observation</text>
<text x="276" y="309" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">History / trend / reason</text>
<rect x="504" y="218" width="210" height="100" rx="8" fill="#e8f1fa" stroke="#7195b7"/>
<text x="516" y="243" font-family="Arial, sans-serif" font-size="16" fill="#18394e" font-weight="700" text-anchor="start">Act</text>
<text x="516" y="267" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Add node / onboarding</text>
<text x="516" y="288" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Select diagnostic action</text>
<text x="516" y="309" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Review result + audit</text>
<polyline points="370,152 370,184 129,184 129,218" fill="none" stroke="#426077" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="370,152 370,184 369,184 369,218" fill="none" stroke="#426077" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="370,152 370,184 609,184 609,218" fill="none" stroke="#426077" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="234,269 264,269" fill="none" stroke="#426077" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="474,269 504,269" fill="none" stroke="#426077" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="24" y="390" width="690" height="104" rx="8" fill="#e5f4f1" stroke="#569d92"/>
<text x="36" y="415" font-family="Arial, sans-serif" font-size="16" fill="#18394e" font-weight="700" text-anchor="start">Progressive disclosure and feedback</text>
<text x="36" y="439" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Summary first → selected-node context → raw output on demand.</text>
<text x="36" y="460" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Named dialogs, focus ownership, explicit labels and live messages exist in source.</text>
<text x="36" y="481" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Accessibility conformance still requires an independent keyboard / assistive-tech audit.</text>
<text x="22" y="534" font-family="Arial, sans-serif" font-size="12" fill="#365269" font-weight="400" text-anchor="start">Source-derived model | arrows name requests/data, not deployment acceptance</text></svg>