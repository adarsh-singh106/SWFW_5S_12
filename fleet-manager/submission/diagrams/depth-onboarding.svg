<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="905" viewBox="0 0 1000 905" role="img">
<title>D2 / Enrollment gates</title><desc>Read downward on the left; right-hand boxes describe rejection or operator responsibilities.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#34566b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="905" fill="#f5f8fb"/>
<text x="26" y="35" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#173b50">D2 / Enrollment gates</text>
<text x="26" y="65" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Read downward on the left; right-hand boxes describe rejection or operator responsibilities.</text>
<rect x="25" y="112" width="415" height="105" rx="9" fill="#e7f0fa" stroke="#648db0" stroke-width="1.4"/>
<text x="38" y="139" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">1. Register and scan</text>
<text x="38" y="163" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Validate/store endpoint; exchange host key</text>
<text x="38" y="185" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">without login</text>
<rect x="560" y="112" width="415" height="105" rx="9" fill="#fff2d8" stroke="#b18535" stroke-width="1.4"/>
<text x="573" y="139" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Independent comparison</text>
<text x="573" y="163" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Compare with trusted console; scan alone is</text>
<text x="573" y="185" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">not identity proof</text>
<rect x="25" y="267" width="415" height="105" rx="9" fill="#e7f0fa" stroke="#648db0" stroke-width="1.4"/>
<text x="38" y="294" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">2. Validate confirmation</text>
<text x="38" y="318" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Signature, endpoint/revision/fingerprint</text>
<text x="38" y="340" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">and age &lt;=300 seconds</text>
<rect x="560" y="267" width="415" height="105" rx="9" fill="#fbe8e6" stroke="#b2736e" stroke-width="1.4"/>
<text x="573" y="294" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Reject / rescan</text>
<text x="573" y="318" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Expired, changed or invalid; assert checks</text>
<text x="573" y="340" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">disappear under -O</text>
<rect x="25" y="422" width="415" height="105" rx="9" fill="#e7f0fa" stroke="#648db0" stroke-width="1.4"/>
<text x="38" y="449" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">3. Lock and re-fetch key</text>
<text x="38" y="473" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Cross-process trust-store lock; compare</text>
<text x="38" y="495" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">current fingerprint</text>
<rect x="560" y="422" width="415" height="105" rx="9" fill="#fbe8e6" stroke="#b2736e" stroke-width="1.4"/>
<text x="573" y="449" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Reject changed identity</text>
<text x="573" y="473" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Malformed/ambiguous store or conflicting</text>
<text x="573" y="495" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">existing pin fails</text>
<rect x="25" y="577" width="415" height="105" rx="9" fill="#e4f4ef" stroke="#4a9487" stroke-width="1.4"/>
<text x="38" y="604" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">4. Publish matching pin</text>
<text x="38" y="628" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Identical pin: no replacement; new pin:</text>
<text x="38" y="650" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">atomic file replace</text>
<rect x="560" y="577" width="415" height="105" rx="9" fill="#fff2d8" stroke="#b18535" stroke-width="1.4"/>
<text x="573" y="604" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Separate client bootstrap</text>
<text x="573" y="628" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Manually authorize controller public key on</text>
<text x="573" y="650" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">target</text>
<rect x="25" y="732" width="415" height="105" rx="9" fill="#e7f0fa" stroke="#648db0" stroke-width="1.4"/>
<text x="38" y="759" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">5. Authenticated SSH check</text>
<text x="38" y="783" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Pinned host + configured client key;</text>
<text x="38" y="805" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">persist observation</text>
<rect x="560" y="732" width="415" height="105" rx="9" fill="#e4f4ef" stroke="#4a9487" stroke-width="1.4"/>
<text x="573" y="759" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Readiness interpretation</text>
<text x="573" y="783" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Current revision and decisive</text>
<text x="573" y="805" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">authentication history</text>
<polyline points="440,164.5 560,164.5" fill="none" stroke="#34566b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="500.0" y="154.5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#173b50">compare</text>
<polyline points="232.5,217 232.5,267" fill="none" stroke="#34566b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="242.5" y="246.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">enroll request</text>
<polyline points="440,319.5 560,319.5" fill="none" stroke="#34566b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="500.0" y="309.5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#173b50">invalid</text>
<polyline points="232.5,372 232.5,422" fill="none" stroke="#34566b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="242.5" y="401.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">accepted</text>
<polyline points="440,474.5 560,474.5" fill="none" stroke="#34566b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="500.0" y="464.5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#173b50">conflict</text>
<polyline points="232.5,527 232.5,577" fill="none" stroke="#34566b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="242.5" y="556.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">matches</text>
<polyline points="440,629.5 560,629.5" fill="none" stroke="#34566b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="500.0" y="619.5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#173b50">separate</text>
<polyline points="232.5,682 232.5,732" fill="none" stroke="#34566b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="242.5" y="711.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">credentials ready</text>
<polyline points="440,784.5 560,784.5" fill="none" stroke="#34566b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="500.0" y="774.5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#173b50">derive</text>
<text x="26" y="887" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">Source-derived implementation view | branch labels are conditions, not measured acceptance</text></svg>