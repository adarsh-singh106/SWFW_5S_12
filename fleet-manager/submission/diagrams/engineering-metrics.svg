<text x="36" y="110" font-family="Arial, sans-serif" font-size="16" fill="#18394e" font-weight="700" text-anchor="start">Linux kernel / exporters</text>
<text x="36" y="134" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">CPU / memory / disk</text>
<text x="36" y="155" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Network / load / uptime</text>
<rect x="274" y="85" width="200" height="95" rx="8" fill="#e5f4f1" stroke="#569d92"/>
<text x="286" y="110" font-family="Arial, sans-serif" font-size="16" fill="#18394e" font-weight="700" text-anchor="start">Prometheus</text>
<text x="286" y="134" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">5 s scrape / 4 s timeout</text>
<text x="286" y="155" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Time-series database</text>
<rect x="524" y="85" width="192" height="95" rx="8" fill="#e5f4f1" stroke="#569d92"/>
<text x="536" y="110" font-family="Arial, sans-serif" font-size="16" fill="#18394e" font-weight="700" text-anchor="start">Grafana</text>
<text x="536" y="134" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Provisioned datasource</text>
<text x="536" y="155" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Time-range panels</text>
<polyline points="224,133 274,133" fill="none" stroke="#426077" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="234" y="120" font-family="Arial, sans-serif" font-size="13" fill="#18394e" font-weight="400" text-anchor="start">pull</text>
<polyline points="474,133 524,133" fill="none" stroke="#426077" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="479" y="120" font-family="Arial, sans-serif" font-size="13" fill="#18394e" font-weight="400" text-anchor="start">query</text>
<rect x="274" y="256" width="200" height="116" rx="8" fill="#e8f1fa" stroke="#7195b7"/>
<text x="286" y="281" font-family="Arial, sans-serif" font-size="16" fill="#18394e" font-weight="700" text-anchor="start">Fixed-query health API</text>
<text x="286" y="305" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Registered nodes only</text>
<text x="286" y="326" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Bounded PromQL requests</text>
<text x="286" y="347" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Missing / old → unavailable</text>
