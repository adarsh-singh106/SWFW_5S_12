<text x="418" y="445" font-family="Arial, sans-serif" font-size="16" fill="#18394e" font-weight="700" text-anchor="start">Controller /metrics</text>
<text x="418" y="469" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Application telemetry → Prometheus</text>
<text x="418" y="490" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Separate from node resource metrics</text>
