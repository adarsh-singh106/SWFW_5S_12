<text x="573" y="296" font-family="Arial, sans-serif" font-size="13" fill="#18394e" font-weight="400" text-anchor="start">scrape</text>
<text x="22" y="544" font-family="Arial, sans-serif" font-size="12" fill="#365269" font-weight="400" text-anchor="start">Source-derived model | arrows name requests/data, not deployment acceptance</text></svg>