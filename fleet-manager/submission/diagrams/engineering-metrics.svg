<text x="388" y="220" font-family="Arial, sans-serif" font-size="13" fill="#18394e" font-weight="400" text-anchor="start">Query + sample timestamp</text>
<rect x="24" y="420" width="310" height="85" rx="8" fill="#e8f1fa" stroke="#7195b7"/>
<text x="36" y="445" font-family="Arial, sans-serif" font-size="16" fill="#18394e" font-weight="700" text-anchor="start">Native browser health views</text>
<text x="36" y="469" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Summary → node detail → trends</text>
<text x="36" y="490" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Missing data ≠ numeric zero</text>
