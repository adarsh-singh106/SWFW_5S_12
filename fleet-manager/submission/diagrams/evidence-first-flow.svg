<rect width="1000" height="570" fill="#f5f7f5"/>
<g font-family="Arial" fill="#263b30" text-anchor="middle">
<text x="500" y="35" font-size="24" font-weight="bold">Fleet Manager: control and telemetry are independent</text>
<g fill="#e5eee7" stroke="#70907a" stroke-width="2">
<rect x="35" y="65" width="570" height="62" rx="8"/>
<rect x="35" y="165" width="570" height="70" rx="8"/>
<rect x="35" y="275" width="570" height="70" rx="8"/>
<rect x="35" y="385" width="570" height="70" rx="8"/>
