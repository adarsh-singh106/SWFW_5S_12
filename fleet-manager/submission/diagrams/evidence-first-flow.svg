<rect x="660" y="165" width="305" height="70" rx="8"/>
<rect x="660" y="275" width="305" height="70" rx="8"/>
<rect x="660" y="385" width="305" height="70" rx="8"/>
<rect x="35" y="495" width="930" height="55" rx="8" fill="#f2eadb"/>
</g>
<g font-size="19">
<text x="320" y="91">Authenticate operator / register endpoint</text><text x="320" y="115" font-size="15">Session + CSRF; inventory does not establish host trust</text>
<text x="320" y="193">Scan → independently compare → pin SSH host key</text><text x="320" y="219" font-size="15">Mismatch: stop; client key authorization is a separate step</text>
<text x="320" y="303">Bounded SSH observation → freshness / classified state</text><text x="320" y="329" font-size="15">Scheduler or explicit check; persist timestamped result</text>
<text x="320" y="413">Approved action → validate → bounded SSH → record</text><text x="320" y="439" font-size="15">Unknown completion stays UNCERTAIN; no blind replay</text>
<text x="812" y="103">Linux Node Exporter :9100</text>
<text x="812" y="193">Prometheus scrape and store</text><text x="812" y="219" font-size="15">Five-second configured interval</text>
<text x="812" y="303">Fixed-query health / Grafana</text><text x="812" y="329" font-size="15">Prometheus is the time-series store</text>
<text x="812" y="413">Metrics, units and source times</text><text x="812" y="439" font-size="15">Absent samples remain gaps</text>
<text x="500" y="519">Failure paths: reject unsafe input / identity; bound local waiting; expose stale or missing evidence</text>
<text x="500" y="540" font-size="15">Diagram describes implementation flow, not proof that a deployment or experiment passed.</text>
</g></g>
