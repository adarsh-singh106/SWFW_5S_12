<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="905" viewBox="0 0 1000 905" role="img">
<title>D6 / Completion recovery without replay</title><desc>Control-plane persistence retry is not a retry of remote execution.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#34566b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="905" fill="#f5f8fb"/>
<text x="26" y="35" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#173b50">D6 / Completion recovery without replay</text>
<text x="26" y="65" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Control-plane persistence retry is not a retry of remote execution.</text>
<rect x="25" y="112" width="415" height="105" rx="9" fill="#e7f0fa" stroke="#648db0" stroke-width="1.4"/>
<text x="38" y="139" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Worker result received</text>
<text x="38" y="163" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Remote completion fields exist in</text>
<text x="38" y="185" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">controller memory</text>
<rect x="560" y="112" width="415" height="105" rx="9" fill="#fbe8e6" stroke="#b2736e" stroke-width="1.4"/>
<text x="573" y="139" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Controller restarts</text>
<text x="573" y="163" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Process-local pending results can be lost</text>
<rect x="25" y="267" width="415" height="105" rx="9" fill="#e7f0fa" stroke="#648db0" stroke-width="1.4"/>
<text x="38" y="294" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">update_completion attempts</text>
<text x="38" y="318" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Two local write attempts in _complete</text>
<rect x="560" y="267" width="415" height="105" rx="9" fill="#fff2d8" stroke="#b18535" stroke-width="1.4"/>
<text x="573" y="294" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Startup reconcile_running</text>
<text x="573" y="318" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Remaining RUNNING -&gt; UNCERTAIN /</text>
<text x="573" y="340" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">CONTROL_PLANE_RESTARTED</text>
<rect x="25" y="422" width="415" height="105" rx="9" fill="#e7f0fa" stroke="#648db0" stroke-width="1.4"/>
<text x="38" y="449" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Both writes fail</text>
<text x="38" y="473" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Pending memory entry; UNCERTAIN /</text>
<text x="38" y="495" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">UNAVAILABLE; raise error</text>
<rect x="560" y="422" width="415" height="105" rx="9" fill="#fbe8e6" stroke="#b2736e" stroke-width="1.4"/>
<text x="573" y="449" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Database may remain RUNNING</text>
<text x="573" y="473" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Error includes operation ID and persisted</text>
<text x="573" y="495" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">outcome</text>
<rect x="25" y="577" width="415" height="105" rx="9" fill="#e7f0fa" stroke="#648db0" stroke-width="1.4"/>
<text x="38" y="604" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">recover_completions</text>
<text x="38" y="628" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Retry local completion update; no SSH</text>
<text x="38" y="650" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">dispatch</text>
<rect x="560" y="577" width="415" height="105" rx="9" fill="#fff2d8" stroke="#b18535" stroke-width="1.4"/>
<text x="573" y="604" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Lookup / investigate</text>
<text x="573" y="628" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">No exactly-once claim; inspect remote state</text>
<text x="573" y="650" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">if needed</text>
<rect x="25" y="732" width="415" height="105" rx="9" fill="#e4f4ef" stroke="#4a9487" stroke-width="1.4"/>
<text x="38" y="759" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Write succeeds</text>
<text x="38" y="783" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Remove pending entry; retain conservative</text>
<text x="38" y="805" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">uncertain result</text>
<rect x="560" y="732" width="415" height="105" rx="9" fill="#fff2d8" stroke="#b18535" stroke-width="1.4"/>
<text x="573" y="759" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">No automatic remote replay</text>
<text x="573" y="783" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">A lost result does not prove an unexecuted</text>
<text x="573" y="805" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">command</text>
<polyline points="232.5,217 232.5,267" fill="none" stroke="#34566b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="242.5" y="246.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">persist</text>
<polyline points="767.5,217 767.5,267" fill="none" stroke="#34566b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="777.5" y="246.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">initialize</text>
<polyline points="232.5,372 232.5,422" fill="none" stroke="#34566b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="242.5" y="401.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">fails twice</text>
<polyline points="440,474.5 560,474.5" fill="none" stroke="#34566b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="500.0" y="464.5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#173b50">state</text>
<polyline points="232.5,527 232.5,577" fill="none" stroke="#34566b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="242.5" y="556.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">local repair</text>
<polyline points="440,629.5 560,629.5" fill="none" stroke="#34566b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="500.0" y="619.5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#173b50">operator</text>
<polyline points="232.5,682 232.5,732" fill="none" stroke="#34566b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="242.5" y="711.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">success</text>
<text x="26" y="887" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">Source-derived implementation view | branch labels are conditions, not measured acceptance</text></svg>