<text x="500.0" y="619.5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#173b50">invalid</text>
<polyline points="232.5,682 232.5,732" fill="none" stroke="#34566b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="242.5" y="711.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">passes</text>
