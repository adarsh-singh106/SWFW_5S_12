  <g transform="translate(820, 570)">
    <rect width="340" height="200" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <rect width="340" height="34" rx="8" fill="#dcfce7"/>
    <circle cx="16" cy="17" r="5" fill="#10b981"/>
    <text x="28" y="22" fill="#14532d" font-size="12" font-weight="700">MANAGED NODE C (`fleet-node-c`)</text>
    <rect x="250" y="8" width="75" height="18" rx="4" fill="#bbf7d0"/>
    <text x="287" y="21" fill="#166534" font-size="9" font-weight="700" text-anchor="middle">REACHABLE</text>

    <text x="16" y="58" fill="#166534" font-size="11" font-weight="600">IP: 10.160.0.4 · Debian GNU/Linux 12 (Bookworm)</text>
