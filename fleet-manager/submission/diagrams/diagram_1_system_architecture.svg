    <text x="16" y="150" fill="#334155" font-size="10">• Kernel Metrics: /proc/stat, /proc/meminfo, /proc/net</text>
    
    <rect x="16" y="165" width="308" height="24" rx="4" fill="#dcfce7"/>
    <text x="170" y="181" fill="#14532d" font-size="9" font-family="Consolas, monospace" text-anchor="middle">Verified: system.memory (1.93s · Exit 0)</text>
  </g>

