<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>

    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#059669" />
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#7c3aed" />
    </marker>
    <marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#475569" />
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="0" y="0" width="1200" height="70" fill="#0f172a"/>
  <text x="40" y="36" fill="#f8fafc" font-size="20" font-weight="700">SWFW_5S_12: Distributed Linux Fleet Management Architecture</text>
  <text x="40" y="56" fill="#94a3b8" font-size="12">End-to-End System Flow: Identity-Aware Proxy Ingress, FastAPI Control Plane, Decoupled Observability &amp; Multi-Node Fleet</text>
  <rect x="1030" y="20" width="130" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="1095" y="39" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">GCP LIVE CLUSTER</text>

  <!-- Container 1: Operator Layer (Top Left) -->
  <g transform="translate(40, 95)">
    <rect width="320" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="320" height="34" rx="8" fill="#f1f5f9"/>
    <text x="16" y="22" fill="#0f172a" font-size="13" font-weight="700">OPERATOR WORKSTATION / BROWSER</text>
    <text x="16" y="58" fill="#334155" font-size="11" font-weight="600">Administrative Client Interface</text>
    <text x="16" y="76" fill="#64748b" font-size="10">• Browser UI: Dashboard, Inventory, Workbench, Health</text>
    <text x="16" y="94" fill="#64748b" font-size="10">• REST / JSON API Client: Token-Authenticated Operations</text>
    <text x="16" y="112" fill="#64748b" font-size="10">• Security: HttpOnly Session Cookie + X-CSRF-Token</text>
    <rect x="16" y="122" width="140" height="18" rx="4" fill="#e2e8f0"/>
    <text x="86" y="134" fill="#1e293b" font-size="9" font-family="Consolas, monospace" text-anchor="middle">127.0.0.1:8000 (Loopback)</text>
  </g>

  <!-- Container 2: Security & Ingress Boundary (Top Middle) -->
  <g transform="translate(400, 95)">
    <rect width="360" height="150" rx="8" fill="#fefce8" stroke="#fef08a" stroke-width="1.5"/>
    <rect width="360" height="34" rx="8" fill="#fef9c3"/>
    <text x="16" y="22" fill="#713f12" font-size="13" font-weight="700">SECURITY &amp; INGRESS GATEWAY</text>
    <text x="16" y="58" fill="#854d0e" font-size="11" font-weight="600">Google Cloud Identity-Aware Proxy (IAP)</text>
    <text x="16" y="76" fill="#713f12" font-size="10">• Strict Zero-Public-IP Architecture (No Ingress Exposure)</text>
    <text x="16" y="94" fill="#713f12" font-size="10">• Encrypted TCP Forwarding: Port 22 SSH Tunnel</text>
    <text x="16" y="112" fill="#713f12" font-size="10">• VPC Firewall Gate: Allow 35.235.240.0/20 on Port 22</text>
    <rect x="16" y="122" width="180" height="18" rx="4" fill="#fef08a"/>
    <text x="106" y="134" fill="#713f12" font-size="9" font-family="Consolas, monospace" text-anchor="middle">Tunnel: asia-south1-a VPC</text>
  </g>

  <!-- Container 3: Decoupled Observability Suite (Top Right) -->
  <g transform="translate(800, 95)">
    <rect width="360" height="150" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <rect width="360" height="34" rx="8" fill="#ffedd5"/>
    <text x="16" y="22" fill="#7c2d12" font-size="13" font-weight="700">DECOUPLED OBSERVABILITY SUITE</text>
    <text x="16" y="58" fill="#9a3412" font-size="11" font-weight="600">Prometheus Server + Grafana Visualization</text>
    <text x="16" y="76" fill="#7c2d12" font-size="10">• Prometheus v2.45: Scrapes Node Exporter :9100 (60s)</text>
    <text x="16" y="94" fill="#7c2d12" font-size="10">• Time-Series TSDB: Independent local metric storage</text>
    <text x="16" y="112" fill="#7c2d12" font-size="10">• Grafana v10.2: Port :3000 Provisioned Dashboards</text>
    <rect x="16" y="122" width="220" height="18" rx="4" fill="#fed7aa"/>
    <text x="126" y="134" fill="#7c2d12" font-size="9" font-family="Consolas, monospace" text-anchor="middle">Fixed PromQL Proxy: /api/nodes/{id}/health</text>
  </g>

  <!-- Connectors between Top Layer -->
  <path d="M 360 170 L 400 170" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 580 245 L 580 280 L 980 280 L 980 245" stroke="#9a3412" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Big Container: Fleet Controller Node (Middle Layer) -->
  <g transform="translate(40, 275)">
    <rect width="1120" height="240" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect width="1120" height="36" rx="8" fill="#f1f5f9"/>
    <circle cx="20" cy="18" r="6" fill="#10b981"/>
    <text x="36" y="23" fill="#0f172a" font-size="13" font-weight="700">FLEET CONTROLLER PLANE (`fleet-controller` · 10.160.0.2 · Debian 12 · Single-Worker Loopback Isolation)</text>

    <!-- Sub-block 1: Auth & API Gateway -->
    <rect x="20" y="50" width="250" height="170" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="72" fill="#0f172a" font-size="11" font-weight="700">1. HTTP Boundary &amp; Auth</text>
    <text x="32" y="92" fill="#475569" font-size="10">• FastAPI / Uvicorn (Single Worker)</text>
    <text x="32" y="110" fill="#475569" font-size="10">• Argon2id Password Verifier</text>
    <text x="32" y="128" fill="#475569" font-size="10">• Sliding-Window Rate Limiter</text>
    <text x="32" y="146" fill="#475569" font-size="10">• CSRF Synchronizer Token</text>
    <text x="32" y="164" fill="#475569" font-size="10">• In-memory Session Cache</text>
    <rect x="32" y="185" width="130" height="20" rx="3" fill="#e2e8f0"/>
    <text x="97" y="198" fill="#1e293b" font-size="9" font-family="Consolas, monospace" text-anchor="middle">Bound: 127.0.0.1:8000</text>

    <!-- Sub-block 2: Inventory & Trust -->
    <rect x="290" y="50" width="250" height="170" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="302" y="72" fill="#0f172a" font-size="11" font-weight="700">2. Cryptographic Trust &amp; Inventory</text>
    <text x="302" y="92" fill="#475569" font-size="10">• Node Endpoint Normalization</text>
    <text x="302" y="110" fill="#475569" font-size="10">• Ephemeral Host Key Extraction</text>
    <text x="302" y="128" fill="#475569" font-size="10">• SHA-256 Fingerprint Compare</text>
    <text x="302" y="146" fill="#475569" font-size="10">• Atomic known_hosts Pinning</text>
    <text x="302" y="164" fill="#475569" font-size="10">• Anti-TOFU Security Policy</text>
    <rect x="302" y="185" width="170" height="20" rx="3" fill="#e2e8f0"/>
    <text x="387" y="198" fill="#1e293b" font-size="9" font-family="Consolas, monospace" text-anchor="middle">Mutex: known_hosts.lock</text>

    <!-- Sub-block 3: Scheduled Probing & Availability -->
    <rect x="560" y="50" width="260" height="170" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="572" y="72" fill="#0f172a" font-size="11" font-weight="700">3. Availability Detection Engine</text>
    <text x="572" y="92" fill="#475569" font-size="10">• 60s Jittered Scheduler (±10% Uniform)</text>
    <text x="572" y="110" fill="#475569" font-size="10">• 4-Worker Concurrency Semaphore</text>
    <text x="572" y="128" fill="#475569" font-size="10">• 12s Hard Probe Execution Budget</text>
    <text x="572" y="146" fill="#475569" font-size="10">• Strict 5-State Transition Engine</text>
    <text x="572" y="164" fill="#475569" font-size="10">• Non-blocking Failure Isolation</text>
    <rect x="572" y="185" width="180" height="20" rx="3" fill="#e2e8f0"/>
    <text x="662" y="198" fill="#1e293b" font-size="9" font-family="Consolas, monospace" text-anchor="middle">TTL: 180s Freshness Window</text>

    <!-- Sub-block 4: Operations Workbench & SQLite WAL -->
    <rect x="840" y="50" width="260" height="170" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="852" y="72" fill="#0f172a" font-size="11" font-weight="700">4. Controlled Operations &amp; WAL</text>
    <text x="852" y="92" fill="#475569" font-size="10">• Allowlist Catalog: 4 POSIX actions</text>
    <text x="852" y="110" fill="#475569" font-size="10">• 15s Hard Deadline · 64 KiB Buffer Cap</text>
    <text x="852" y="128" fill="#475569" font-size="10">• Subprocess Sandboxing &amp; SIGKILL</text>
    <text x="852" y="146" fill="#475569" font-size="10">• SQLite WAL: PRAGMA synchronous=NORMAL</text>
    <text x="852" y="164" fill="#475569" font-size="10">• Immutable Transactional Audit Log</text>
    <rect x="852" y="185" width="160" height="20" rx="3" fill="#e2e8f0"/>
    <text x="932" y="198" fill="#1e293b" font-size="9" font-family="Consolas, monospace" text-anchor="middle">DB: inventory.db (WAL Mode)</text>
  </g>

  <!-- Ingress arrow to Controller -->
  <path d="M 580 245 L 580 275" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="520" y="248" width="120" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="580" y="262" fill="#1e293b" font-size="10" font-weight="600" text-anchor="middle">HTTPS / TCP Tunnel</text>

