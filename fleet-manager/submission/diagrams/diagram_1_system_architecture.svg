  <path d="M 220 515 L 220 570" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 600 515 L 600 570" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 980 515 L 980 570" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Telemetry Lines from Nodes to Prometheus -->
  <path d="M 320 570 L 320 540 L 1050 540 L 1050 245" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <rect x="590" y="530" width="190" height="18" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="685" y="543" fill="#9a3412" font-size="9" font-family="Consolas, monospace" text-anchor="middle">Prometheus Scrapes :9100 (60s Cadence)</text>

