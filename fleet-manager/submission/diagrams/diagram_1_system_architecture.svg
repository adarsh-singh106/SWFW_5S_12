    <text x="16" y="78" fill="#334155" font-size="10">• SSHv2 Daemon: OpenSSH 9.2p1 on Port 22</text>
    <text x="16" y="96" fill="#334155" font-size="10">• Unprivileged User: fleetbootstrap (No Sudoers)</text>
