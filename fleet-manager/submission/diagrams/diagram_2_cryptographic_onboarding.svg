<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>

    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#2563eb" />
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#dc2626" />
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#059669" />
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="0" y="0" width="1200" height="70" fill="#0f172a"/>
  <text x="40" y="36" fill="#f8fafc" font-size="20" font-weight="700">Cryptographic Node Onboarding &amp; Out-of-Band MITM Defense Protocol</text>
  <text x="40" y="56" fill="#94a3b8" font-size="12">Sequence Flow: Why Blind Trust-On-First-Use (TOFU) Fails &amp; How Pinned Host Identity Guarantees Integrity</text>

  <!-- Lifeline Columns -->
  <!-- Column 1: Operator -->
  <rect x="60" y="90" width="180" height="36" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="150" y="113" fill="#1e3a8a" font-size="12" font-weight="700" text-anchor="middle">Operator Browser</text>
  <line x1="150" y1="126" x2="150" y2="800" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Column 2: Controller API -->
  <rect x="290" y="90" width="180" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="113" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Fleet Controller API</text>
  <line x1="380" y1="126" x2="380" y2="800" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Column 3: SQLite DB -->
  <rect x="520" y="90" width="180" height="36" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="610" y="113" fill="#5b21b6" font-size="12" font-weight="700" text-anchor="middle">SQLite (inventory.db)</text>
  <line x1="610" y1="126" x2="610" y2="800" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Column 4: Trust Store -->
  <rect x="750" y="90" width="180" height="36" rx="6" fill="#fefce8" stroke="#fef08a" stroke-width="1.5"/>
  <text x="840" y="113" fill="#713f12" font-size="12" font-weight="700" text-anchor="middle">known_hosts Store</text>
  <line x1="840" y1="126" x2="840" y2="800" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Column 5: Managed Linux Node -->
  <rect x="980" y="90" width="180" height="36" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="1070" y="113" fill="#14532d" font-size="12" font-weight="700" text-anchor="middle">Target Linux Node</text>
  <line x1="1070" y1="126" x2="1070" y2="800" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- STEP 1: Registration Phase -->
  <rect x="50" y="145" width="1100" height="95" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="50" y="145" width="140" height="22" rx="4" fill="#e2e8f0"/>
  <text x="120" y="160" fill="#334155" font-size="10" font-weight="700" text-anchor="middle">STEP 1: REGISTRATION</text>

  <line x1="150" y1="185" x2="380" y2="185" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <text x="265" y="178" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">1. POST /api/nodes {name, address, port}</text>

  <line x1="380" y1="205" x2="610" y2="205" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <text x="495" y="198" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">2. INSERT (status: NOT_CHECKED, setup: PENDING_KEY_SCAN)</text>

  <line x1="610" y1="225" x2="150" y2="225" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
  <text x="380" y="220" fill="#475569" font-size="10" text-anchor="middle">3. Return 201 Created (Node ID #1 · Endpoint Registered)</text>

  <!-- STEP 2: Key Extraction Phase -->
  <rect x="50" y="255" width="1100" height="115" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="50" y="255" width="180" height="22" rx="4" fill="#e2e8f0"/>
  <text x="140" y="270" fill="#334155" font-size="10" font-weight="700" text-anchor="middle">STEP 2: HOST KEY EXTRACTION</text>

  <line x1="150" y1="295" x2="380" y2="295" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <text x="265" y="288" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">4. POST /api/nodes/1/scan-host-key</text>

  <line x1="380" y1="315" x2="1070" y2="315" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <text x="725" y="308" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">5. TCP Connect &amp; SSH Banner Handshake (Port 22)</text>

  <line x1="1070" y1="335" x2="380" y2="335" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-green)"/>
  <text x="725" y="330" fill="#065f46" font-size="10" font-weight="600" text-anchor="middle">6. Returns Public Host Key (ssh-ed25519)</text>

  <line x1="380" y1="355" x2="150" y2="355" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
  <text x="265" y="350" fill="#475569" font-size="10" text-anchor="middle">7. 200 OK: SHA256:4t7E0k... (NOT PINNED YET!)</text>

  <!-- STEP 3: Out-of-Band Verification Phase (CRUCIAL MITM DEFENSE) -->
  <rect x="50" y="385" width="1100" height="150" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <rect x="50" y="385" width="310" height="22" rx="4" fill="#fee2e2"/>
  <text x="205" y="400" fill="#991b1b" font-size="10" font-weight="700" text-anchor="middle">STEP 3: OUT-OF-BAND VERIFICATION (MITM DEFENSE)</text>

  <!-- Out-of-band console check note -->
  <rect x="160" y="415" width="900" height="30" rx="4" fill="#ffffff" stroke="#f87171" stroke-width="1"/>
  <text x="610" y="434" fill="#b91c1c" font-size="11" font-weight="700" text-anchor="middle">OUT-OF-BAND CHECK: Operator runs `ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub` on Physical/Cloud Console</text>

  <line x1="150" y1="465" x2="380" y2="465" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="265" y="458" fill="#991b1b" font-size="10" font-weight="700" text-anchor="middle">8. POST /api/nodes/1/trust-host-key {acknowledged_fingerprint}</text>

  <line x1="380" y1="485" x2="840" y2="485" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="610" y="478" fill="#991b1b" font-size="10" font-weight="700" text-anchor="middle">9. Acquire File Lock (known_hosts.lock) &amp; Append Pinned Key: [10.160.0.5]:22 ssh-ed25519 AAAAC3Nza...</text>

  <line x1="380" y1="510" x2="610" y2="510" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <text x="495" y="503" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle">10. UPDATE setup_state = 'PENDING_KEY_DEPLOYMENT'</text>

  <line x1="380" y1="525" x2="150" y2="525" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
  <text x="265" y="520" fill="#475569" font-size="10" text-anchor="middle">11. 200 OK: Host Identity Cryptographically Pinned</text>

  <!-- STEP 4: Client Key Deployment & Handshake -->
  <rect x="50" y="550" width="1100" height="150" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="50" y="550" width="280" height="22" rx="4" fill="#dcfce7"/>
  <text x="190" y="565" fill="#14532d" font-size="10" font-weight="700" text-anchor="middle">STEP 4: CLIENT KEY DEPLOYMENT &amp; HANDSHAKE</text>

  <!-- Key deployment note -->
  <rect x="160" y="580" width="900" height="28" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="610" y="598" fill="#15803d" font-size="10" font-weight="600" text-anchor="middle">DEPLOYMENT: Operator adds Controller `id_ed25519.pub` to managed node `~fleetbootstrap/.ssh/authorized_keys`</text>

  <line x1="150" y1="625" x2="380" y2="625" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="265" y="618" fill="#065f46" font-size="10" font-weight="700" text-anchor="middle">12. POST /api/nodes/1/check-ssh</text>

  <line x1="380" y1="645" x2="840" y2="645" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="610" y="638" fill="#065f46" font-size="10" font-weight="600" text-anchor="middle">13. Verify Host Key matches pinned known_hosts record</text>

  <line x1="380" y1="665" x2="1070" y2="665" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="725" y="658" fill="#065f46" font-size="10" font-weight="700" text-anchor="middle">14. SSH Auth with Controller id_ed25519 (Strict Host Key Verification)</text>

  <line x1="1070" y1="680" x2="380" y2="680" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-green)"/>
  <text x="725" y="675" fill="#065f46" font-size="10" text-anchor="middle">15. Authenticated Session Established (Exit Code 0)</text>

  <!-- Complete Transition -->
  <line x1="380" y1="715" x2="610" y2="715" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="495" y="708" fill="#065f46" font-size="10" font-weight="700" text-anchor="middle">16. UPDATE nodes SET setup = 'READY', observation = 'REACHABLE'</text>

  <line x1="380" y1="735" x2="150" y2="735" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="265" y="730" fill="#065f46" font-size="10" font-weight="700" text-anchor="middle">17. 200 OK: Node Fully Onboarded &amp; Operational</text>

  <!-- Security Invariant Banner -->
  <rect x="50" y="760" width="1100" height="50" rx="6" fill="#1e293b"/>
  <text x="600" y="780" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">CRITICAL SECURITY INVARIANT: ZERO TRUST-ON-FIRST-USE (TOFU)</text>
  <text x="600" y="798" fill="#94a3b8" font-size="10" text-anchor="middle">If an attacker attempts DNS spoofing or ARP cache poisoning, host key mismatch triggers immediate CHECK_ERROR / HOST_KEY_MISMATCH alert.</text>
</svg>
