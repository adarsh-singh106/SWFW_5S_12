<svg xmlns="http://www.w3.org/2000/svg" width="740" height="570" viewBox="0 0 740 570" role="img"><title>02 / Runtime and trust boundaries</title><desc>Reference topology, not a claim that every listener or firewall was verified.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#426077" stroke-width="1.3"/></marker></defs>
<rect width="740" height="570" rx="14" fill="#f5f8fb"/>
<text x="22" y="31" font-family="Arial, sans-serif" font-size="21" fill="#12344b" font-weight="700" text-anchor="start">02 / Runtime and trust boundaries</text>
<text x="22" y="56" font-family="Arial, sans-serif" font-size="13" fill="#365269" font-weight="400" text-anchor="start">Reference topology, not a claim that every listener or firewall was verified.</text>
<rect x="24" y="85" width="690" height="75" rx="8" fill="#e8f1fa" stroke="#7195b7"/>
<text x="36" y="110" font-family="Arial, sans-serif" font-size="16" fill="#18394e" font-weight="700" text-anchor="start">Operator workstation</text>
<text x="36" y="134" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Browser → local tunnel / loopback access; verify actual access rules before exposure.</text>
<rect x="24" y="205" width="330" height="145" rx="8" fill="#e8f1fa" stroke="#7195b7"/>
<text x="36" y="230" font-family="Arial, sans-serif" font-size="16" fill="#18394e" font-weight="700" text-anchor="start">Controller host / one application worker</text>
<text x="36" y="254" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">FastAPI routes → services → repositories</text>
<text x="36" y="275" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Scheduler → bounded SSH checks</text>
<text x="36" y="296" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Operation executor → child processes</text>
<text x="36" y="317" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">SQLite WAL / pinned known_hosts</text>
<rect x="390" y="205" width="324" height="145" rx="8" fill="#e5f4f1" stroke="#569d92"/>
<text x="402" y="230" font-family="Arial, sans-serif" font-size="16" fill="#18394e" font-weight="700" text-anchor="start">Monitoring services</text>
<text x="402" y="254" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Prometheus :9090 → TSDB</text>
<text x="402" y="275" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Grafana :3000 → Prometheus</text>
<text x="402" y="296" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">App :8000 /metrics</text>
<text x="402" y="317" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Node Exporter uses file discovery</text>
<polyline points="180,160 180,205" fill="none" stroke="#426077" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="194" y="188" font-family="Arial, sans-serif" font-size="13" fill="#18394e" font-weight="400" text-anchor="start">127.0.0.1:8000</text>
<polyline points="550,160 550,205" fill="none" stroke="#426077" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="565" y="188" font-family="Arial, sans-serif" font-size="13" fill="#18394e" font-weight="400" text-anchor="start">Separate access paths</text>
<rect x="24" y="415" width="330" height="86" rx="8" fill="#e8f1fa" stroke="#7195b7"/>
<text x="36" y="440" font-family="Arial, sans-serif" font-size="16" fill="#18394e" font-weight="700" text-anchor="start">Managed hosts A / B / C</text>
<text x="36" y="464" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">SSH :22 / pinned identity</text>
<text x="36" y="485" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Independent machines required for fault proof</text>
<rect x="390" y="415" width="324" height="86" rx="8" fill="#e5f4f1" stroke="#569d92"/>
<text x="402" y="440" font-family="Arial, sans-serif" font-size="16" fill="#18394e" font-weight="700" text-anchor="start">Telemetry boundary</text>
<text x="402" y="464" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Node Exporter :9100</text>
<text x="402" y="485" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Exporter reachability ≠ SSH reachability</text>
<polyline points="180,350 180,415" fill="none" stroke="#426077" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="194" y="386" font-family="Arial, sans-serif" font-size="13" fill="#18394e" font-weight="400" text-anchor="start">Outbound SSH</text>
<polyline points="550,415 550,350" fill="none" stroke="#426077" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="565" y="386" font-family="Arial, sans-serif" font-size="13" fill="#18394e" font-weight="400" text-anchor="start">Prometheus pulls</text>
<text x="22" y="554" font-family="Arial, sans-serif" font-size="12" fill="#365269" font-weight="400" text-anchor="start">Source-derived model | arrows name requests/data, not deployment acceptance</text></svg>