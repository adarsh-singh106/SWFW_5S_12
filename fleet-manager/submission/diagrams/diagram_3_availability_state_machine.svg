<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>

    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#2563eb" />
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#dc2626" />
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#059669" />
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#d97706" />
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#7c3aed" />
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="0" y="0" width="1200" height="70" fill="#0f172a"/>
  <text x="40" y="36" fill="#f8fafc" font-size="20" font-weight="700">Node Availability Detection &amp; Graceful Degradation State Machine</text>
  <text x="40" y="56" fill="#94a3b8" font-size="12">5-State Lifecycle: 60s Jittered Background Probes, 180s Freshness TTL, Non-Blocking Concurrency &amp; Fault Isolation</text>

  <!-- Initial State Dot -->
  <circle cx="100" cy="160" r="14" fill="#0f172a"/>
  <circle cx="100" cy="160" r="10" fill="#ffffff"/>
  <circle cx="100" cy="160" r="6" fill="#0f172a"/>
  <text x="100" y="195" fill="#475569" font-size="11" font-weight="600" text-anchor="middle">Registration</text>

  <!-- STATE 1: NOT_CHECKED -->
  <g transform="translate(220, 115)">
    <rect width="220" height="90" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <rect width="220" height="28" rx="8" fill="#e2e8f0"/>
    <text x="110" y="19" fill="#1e293b" font-size="12" font-weight="700" text-anchor="middle">NOT_CHECKED</text>
    <text x="110" y="48" fill="#475569" font-size="10" text-anchor="middle">• Newly registered endpoint</text>
    <text x="110" y="64" fill="#475569" font-size="10" text-anchor="middle">• No live probe executed</text>
    <text x="110" y="80" fill="#64748b" font-size="9" text-anchor="middle">Honest state: 0 false assumptions</text>
  </g>

  <path d="M 120 160 L 220 160" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STATE 2: REACHABLE -->
  <g transform="translate(680, 115)">
    <rect width="260" height="110" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <rect width="260" height="28" rx="8" fill="#dcfce7"/>
    <circle cx="20" cy="14" r="5" fill="#10b981"/>
    <text x="130" y="19" fill="#14532d" font-size="12" font-weight="700" text-anchor="middle">REACHABLE</text>
    <text x="20" y="48" fill="#166534" font-size="10">• Cryptographic SSH auth OK</text>
    <text x="20" y="64" fill="#166534" font-size="10">• Probe succeeded within TTL (≤180s)</text>
    <text x="20" y="80" fill="#166534" font-size="10">• Host key matches pinned trust store</text>
    <text x="20" y="96" fill="#15803d" font-size="9" font-weight="600">• Ready for allowlisted execution</text>
  </g>

  <!-- Transition: NOT_CHECKED -> REACHABLE -->
  <path d="M 440 160 L 680 160" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <rect x="490" y="140" width="140" height="20" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="560" y="154" fill="#065f46" font-size="9" font-weight="700" text-anchor="middle">Probe Success (Exit 0)</text>

  <!-- Self Loop: REACHABLE -> REACHABLE -->
  <path d="M 810 115 C 810 60, 870 60, 870 115" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <rect x="790" y="45" width="130" height="20" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="855" y="59" fill="#14532d" font-size="9" font-weight="600" text-anchor="middle">60s Jittered Probe OK</text>

  <!-- STATE 3: STALE -->
  <g transform="translate(680, 360)">
    <rect width="260" height="110" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
    <rect width="260" height="28" rx="8" fill="#f3e8ff"/>
    <circle cx="20" cy="14" r="5" fill="#a855f7"/>
    <text x="130" y="19" fill="#581c87" font-size="12" font-weight="700" text-anchor="middle">STALE (Freshness Warning)</text>
    <text x="20" y="48" fill="#6b21a8" font-size="10">• No observation received for &gt; 180s</text>
    <text x="20" y="64" fill="#6b21a8" font-size="10">• Controller rebooted or scheduler delayed</text>
    <text x="20" y="80" fill="#6b21a8" font-size="10">• Telemetry frozen, not fabricated</text>
    <text x="20" y="96" fill="#7e22ce" font-size="9" font-weight="600">• Automatic recovery upon next probe</text>
  </g>

  <!-- Transition: REACHABLE -> STALE -->
  <path d="M 850 225 L 850 360" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)"/>
  <rect x="855" y="275" width="130" height="20" rx="4" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="920" y="289" fill="#6b21a8" font-size="9" font-weight="600" text-anchor="middle">Time &gt; 180s (TTL Expired)</text>

  <!-- Recovery: STALE -> REACHABLE -->
  <path d="M 770 360 L 770 225" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="670" y="275" width="95" height="20" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="717" y="289" fill="#065f46" font-size="9" font-weight="600" text-anchor="middle">Next Probe OK</text>

  <!-- STATE 4: UNREACHABLE -->
  <g transform="translate(220, 360)">
    <rect width="240" height="110" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <rect width="240" height="28" rx="8" fill="#fee2e2"/>
    <circle cx="20" cy="14" r="5" fill="#ef4444"/>
    <text x="120" y="19" fill="#991b1b" font-size="12" font-weight="700" text-anchor="middle">UNREACHABLE (Degraded)</text>
    <text x="20" y="48" fill="#b91c1c" font-size="10">• TCP SYN Connection Refused (:22)</text>
    <text x="20" y="64" fill="#b91c1c" font-size="10">• Route Timeout (12s Deadline Expired)</text>
    <text x="20" y="80" fill="#b91c1c" font-size="10">• Target Host Down / Rebooting</text>
    <text x="20" y="96" fill="#dc2626" font-size="9" font-weight="600">• Peer nodes continue unaffected</text>
  </g>

  <!-- Transition: REACHABLE -> UNREACHABLE -->
  <path d="M 720 225 L 380 360" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="470" y="260" width="160" height="20" rx="4" fill="#ffffff" stroke="#fecaca"/>
  <text x="550" y="274" fill="#991b1b" font-size="9" font-weight="600" text-anchor="middle">TCP Timeout / Conn Refused</text>

  <!-- Transition: STALE -> UNREACHABLE -->
  <path d="M 680 415 L 460 415" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="520" y="398" width="110" height="20" rx="4" fill="#ffffff" stroke="#fecaca"/>
  <text x="575" y="412" fill="#991b1b" font-size="9" font-weight="600" text-anchor="middle">Probe Failed Reconnect</text>

  <!-- Recovery: UNREACHABLE -> REACHABLE -->
  <path d="M 340 360 C 340 270, 680 180, 680 180" stroke="#059669" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#arr-green)"/>
  <rect x="360" y="220" width="130" height="20" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="425" y="234" fill="#065f46" font-size="9" font-weight="600" text-anchor="middle">Node Reboot / SSH Restored</text>

  <!-- STATE 5: CHECK_ERROR -->
  <g transform="translate(220, 560)">
    <rect width="240" height="110" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
    <rect width="240" height="28" rx="8" fill="#fef3c7"/>
    <circle cx="20" cy="14" r="5" fill="#f59e0b"/>
    <text x="120" y="19" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">CHECK_ERROR (Auth / MITM)</text>
    <text x="20" y="48" fill="#b45309" font-size="10">• Host Key Mismatch (MITM Alert!)</text>
    <text x="20" y="64" fill="#b45309" font-size="10">• Authentication Rejection (Bad Key)</text>
    <text x="20" y="80" fill="#b45309" font-size="10">• DNS Resolution Failure</text>
    <text x="20" y="96" fill="#d97706" font-size="9" font-weight="600">• Operations BLOCKED for Safety</text>
  </g>

  <!-- Transitions to CHECK_ERROR -->
  <path d="M 330 205 L 330 360" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <path d="M 330 470 L 330 560" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>
  <rect x="250" y="500" width="160" height="20" rx="4" fill="#ffffff" stroke="#fde68a"/>
  <text x="330" y="514" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">Host Key Changed / Auth Fail</text>

  <!-- Architecture Isolation Note Container -->
  <g transform="translate(560, 540)">
    <rect width="560" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="560" height="30" rx="8" fill="#f1f5f9"/>
    <text x="20" y="20" fill="#0f172a" font-size="12" font-weight="700">FAULT TOLERANCE &amp; OBSERVABILITY PRINCIPLES IN THE STATE ENGINE</text>
    <text x="20" y="54" fill="#334155" font-size="10">• Non-Blocking Concurrency: 4 worker semaphore prevents probe storms or thread exhaustion.</text>
    <text x="20" y="72" fill="#334155" font-size="10">• Bounded Timeouts: Each check has a strict 12s budget (TCP connect + banner + auth).</text>
    <text x="20" y="90" fill="#334155" font-size="10">• Honest Gaps: When UNREACHABLE or STALE, Prometheus charts display gaps, never false zeros.</text>
    <text x="20" y="108" fill="#334155" font-size="10">• Degradation Routing: Node failure disables command execution while keeping peer nodes active.</text>
    <rect x="20" y="120" width="520" height="20" rx="4" fill="#e2e8f0"/>
    <text x="280" y="134" fill="#1e293b" font-size="9" font-family="Consolas, monospace" text-anchor="middle">Observed on Live GCP: Node C simulated network partition isolated in 12.0s</text>
  </g>

  <!-- Footer -->
  <rect x="40" y="730" width="1120" height="30" rx="4" fill="#0f172a"/>
  <text x="600" y="750" fill="#f8fafc" font-size="11" text-anchor="middle">State is always backed by timestamped SQLite observation records | PRAGMA journal_mode = WAL ensures atomic updates</text>
</svg>
