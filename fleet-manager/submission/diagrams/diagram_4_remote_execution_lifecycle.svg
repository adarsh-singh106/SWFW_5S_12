<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>

    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#059669" />
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="0" y="0" width="1200" height="70" fill="#0f172a"/>
  <text x="40" y="36" fill="#f8fafc" font-size="20" font-weight="700">Controlled Remote Operations: Sandboxed Execution &amp; Audit Engine</text>
  <text x="40" y="56" fill="#94a3b8" font-size="12">Security Lifecycle: Strict Allowlist Catalog, POSIX Grammar Sanitization, 15s Deadline, 64 KiB Cap &amp; SQLite Durability</text>

  <!-- Step 1: Dispatched Request -->
  <g transform="translate(40, 100)">
    <rect width="250" height="180" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect width="250" height="32" rx="8" fill="#dbeafe"/>
    <text x="16" y="21" fill="#1e40af" font-size="12" font-weight="700">1. OPERATOR DISPATCH</text>
    <text x="16" y="52" fill="#1e3a8a" font-size="11" font-weight="600">POST /api/nodes/{id}/operations</text>
    <text x="16" y="72" fill="#334155" font-size="10">• Action: system.uptime</text>
    <text x="16" y="90" fill="#334155" font-size="10">• Action: system.memory</text>
    <text x="16" y="108" fill="#334155" font-size="10">• Action: system.disk (path)</text>
    <text x="16" y="126" fill="#334155" font-size="10">• Action: service.status (service)</text>
    <rect x="16" y="145" width="218" height="22" rx="4" fill="#bfdbfe"/>
    <text x="125" y="159" fill="#1e3a8a" font-size="9" font-family="Consolas, monospace" text-anchor="middle">Header: X-CSRF-Token + Cookie</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 290 190 L 330 190" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 2: Allowlist Validation -->
  <g transform="translate(330, 100)">
    <rect width="260" height="180" rx="8" fill="#fefce8" stroke="#fef08a" stroke-width="1.5"/>
    <rect width="260" height="32" rx="8" fill="#fef9c3"/>
    <text x="16" y="21" fill="#713f12" font-size="12" font-weight="700">2. STRICT REGEX VALIDATION</text>
    <text x="16" y="52" fill="#854d0e" font-size="11" font-weight="600">POSIX Grammar Boundary</text>
    <text x="16" y="72" fill="#713f12" font-size="10">• Path Regex: ^/[a-zA-Z0-9_\-\./]*$</text>
    <text x="16" y="90" fill="#713f12" font-size="10">• Service: ^[a-zA-Z0-9_\-\.@]{1,64}$</text>
    <text x="16" y="108" fill="#b91c1c" font-size="10" font-weight="600">• Prohibit shell metachars: ; &amp; | ` $</text>
    <text x="16" y="126" fill="#b91c1c" font-size="10" font-weight="600">• Prohibit directory traversal: ..</text>
    <rect x="16" y="145" width="228" height="22" rx="4" fill="#fef08a"/>
    <text x="130" y="159" fill="#713f12" font-size="9" font-family="Consolas, monospace" text-anchor="middle">Reject: 422 Unprocessable Entity</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 590 190 L 630 190" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 3: SQLite Transaction Lock -->
  <g transform="translate(630, 100)">
    <rect width="240" height="180" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
    <rect width="240" height="32" rx="8" fill="#ede9fe"/>
    <text x="16" y="21" fill="#4c1d95" font-size="12" font-weight="700">3. TRANSACTIONAL AUDIT</text>
    <text x="16" y="52" fill="#5b21b6" font-size="11" font-weight="600">SQLite operation_executions</text>
    <text x="16" y="72" fill="#4c1d95" font-size="10">• Generate UUID4 Execution ID</text>
    <text x="16" y="90" fill="#4c1d95" font-size="10">• Record started_at timestamp</text>
    <text x="16" y="108" fill="#4c1d95" font-size="10">• Set initial outcome = RUNNING</text>
    <text x="16" y="126" fill="#4c1d95" font-size="10">• Crash safe: WAL journaling</text>
    <rect x="16" y="145" width="208" height="22" rx="4" fill="#ddd6fe"/>
    <text x="120" y="159" fill="#4c1d95" font-size="9" font-family="Consolas, monospace" text-anchor="middle">Atomic INSERT (No lost state)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 870 190 L 910 190" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 4: Sandboxed Child Process -->
  <g transform="translate(910, 100)">
    <rect width="250" height="180" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <rect width="250" height="32" rx="8" fill="#dcfce7"/>
    <text x="16" y="21" fill="#14532d" font-size="12" font-weight="700">4. SANDBOXED EXECUTION</text>
    <text x="16" y="52" fill="#166534" font-size="11" font-weight="600">Isolated SSHv2 Subprocess</text>
    <text x="16" y="72" fill="#166534" font-size="10">• Pinned Host Key Verification</text>
    <text x="16" y="90" fill="#166534" font-size="10">• Controller Ed25519 Private Key</text>
    <text x="16" y="108" fill="#166534" font-size="10">• Non-interactive execution (no pty)</text>
    <text x="16" y="126" fill="#166534" font-size="10">• Hard 15-second execution deadline</text>
    <rect x="16" y="145" width="218" height="22" rx="4" fill="#bbf7d0"/>
    <text x="125" y="159" fill="#14532d" font-size="9" font-family="Consolas, monospace" text-anchor="middle">Buffer Cap: 64 KiB stdout/stderr</text>
  </g>

  <!-- Downward Execution & Two Branches -->
  <path d="M 1035 280 L 1035 340" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Branch Decision Box -->
  <g transform="translate(895, 340)">
    <rect width="280" height="70" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="140" y="30" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">Execution Outcome Evaluation</text>
    <text x="140" y="50" fill="#475569" font-size="10" text-anchor="middle">Process completed within 15s deadline?</text>
  </g>

  <!-- SUCCESS PATH (Left Branch) -->
  <path d="M 895 375 L 560 375 L 560 440" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <rect x="660" y="358" width="130" height="20" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="725" y="372" fill="#14532d" font-size="9" font-weight="700" text-anchor="middle">YES (Completed &lt; 15s)</text>

  <g transform="translate(360, 440)">
    <rect width="400" height="200" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <rect width="400" height="32" rx="8" fill="#dcfce7"/>
    <circle cx="20" cy="16" r="5" fill="#10b981"/>
    <text x="36" y="21" fill="#14532d" font-size="12" font-weight="700">OUTCOME: SUCCESS (Exit Code 0 or Normal Exit)</text>

    <text x="20" y="54" fill="#166534" font-size="11" font-weight="600">Captured Output &amp; State Durability</text>
    <text x="20" y="74" fill="#334155" font-size="10">• Stream stdout / stderr captured up to 64 KiB buffer</text>
    <text x="20" y="92" fill="#334155" font-size="10">• If output &gt; 64 KiB: set output_truncated = true (DoS defense)</text>
    <text x="20" y="110" fill="#334155" font-size="10">• UPDATE operation_executions: outcome=SUCCESS, exit_code=0</text>
    <text x="20" y="128" fill="#334155" font-size="10">• Return 200 OK: {id, outcome, exit_code, stdout, duration: '1.59s'}</text>
    
    <rect x="20" y="145" width="360" height="40" rx="4" fill="#ffffff" stroke="#86efac"/>
    <text x="200" y="162" fill="#15803d" font-size="9" font-family="Consolas, monospace" text-anchor="middle">Verified GCP Live: system.uptime on fleet-node-a</text>
    <text x="200" y="177" fill="#475569" font-size="9" font-family="Consolas, monospace" text-anchor="middle">11:46:37 up 2 days, 1:59, 1 user, load: 0.10, 0.07, 0.01</text>
  </g>

  <!-- FAILURE / TIMEOUT PATH (Right Branch) -->
  <path d="M 1035 410 L 1035 440" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <rect x="1045" y="415" width="130" height="20" rx="4" fill="#fee2e2" stroke="#fecaca"/>
  <text x="1110" y="429" fill="#991b1b" font-size="9" font-weight="700" text-anchor="middle">NO (Exceeded 15s)</text>

  <g transform="translate(800, 440)">
    <rect width="360" height="200" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <rect width="360" height="32" rx="8" fill="#fee2e2"/>
    <circle cx="20" cy="16" r="5" fill="#ef4444"/>
    <text x="36" y="21" fill="#991b1b" font-size="12" font-weight="700">OUTCOME: FAILURE (Timeout / Disconnect)</text>

    <text x="20" y="54" fill="#b91c1c" font-size="11" font-weight="600">Containment &amp; Unambiguous Audit</text>
    <text x="20" y="74" fill="#334155" font-size="10">• Terminate SSH channel immediately; send SIGKILL</text>
    <text x="20" y="92" fill="#334155" font-size="10">• Do NOT hang worker process or freeze web server</text>
    <text x="20" y="110" fill="#334155" font-size="10">• UPDATE operation_executions: outcome=FAILURE, error=TIMEOUT</text>
    <text x="20" y="128" fill="#334155" font-size="10">• Return 504 Gateway Timeout or classified failure JSON</text>
    
    <rect x="20" y="145" width="320" height="40" rx="4" fill="#ffffff" stroke="#fecaca"/>
    <text x="180" y="162" fill="#b91c1c" font-size="9" font-family="Consolas, monospace" text-anchor="middle">Restart Rule: Incomplete executions reconciled</text>
    <text x="180" y="177" fill="#b91c1c" font-size="9" font-family="Consolas, monospace" text-anchor="middle">as UNCERTAIN (Never blindly replayed!)</text>
  </g>

  <!-- Left: Security Invariants Summary -->
  <g transform="translate(40, 440)">
    <rect width="300" height="200" rx="8" fill="#1e293b"/>
    <rect width="300" height="32" rx="8" fill="#0f172a"/>
    <text x="20" y="21" fill="#38bdf8" font-size="12" font-weight="700">CORE SECURITY INVARIANTS</text>
    <text x="20" y="56" fill="#f8fafc" font-size="10" font-weight="600">1. No Arbitrary Shell:</text>
    <text x="20" y="72" fill="#94a3b8" font-size="9">Users cannot supply custom commands or pipes.</text>
    <text x="20" y="92" fill="#f8fafc" font-size="10" font-weight="600">2. Least Privilege:</text>
    <text x="20" y="108" fill="#94a3b8" font-size="9">Runs under fleetbootstrap user without sudo.</text>
    <text x="20" y="128" fill="#f8fafc" font-size="10" font-weight="600">3. Deterministic Termination:</text>
    <text x="20" y="144" fill="#94a3b8" font-size="9">Hard 15s budget prevents denial-of-service.</text>
    <text x="20" y="164" fill="#f8fafc" font-size="10" font-weight="600">4. Immutable Audit Trail:</text>
    <text x="20" y="180" fill="#94a3b8" font-size="9">Full command, timestamp, duration &amp; stdout kept.</text>
  </g>

  <!-- Footer Banner -->
  <rect x="40" y="660" width="1120" height="35" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="600" y="682" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">All operation history is durably retained in SQLite WAL with foreign keys referencing the nodes table | Cascading deletions safely clean history</text>
</svg>
