<svg xmlns="http://www.w3.org/2000/svg" width="740" height="650" viewBox="0 0 740 650" role="img"><title>03 / Onboarding sequence</title><desc>Identity enrollment is explicit; registration alone never implies a trusted host.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#426077" stroke-width="1.3"/></marker></defs>
<rect width="740" height="650" rx="14" fill="#f5f8fb"/>
<text x="22" y="31" font-family="Arial, sans-serif" font-size="21" fill="#12344b" font-weight="700" text-anchor="start">03 / Onboarding sequence</text>
<text x="22" y="56" font-family="Arial, sans-serif" font-size="13" fill="#365269" font-weight="400" text-anchor="start">Identity enrollment is explicit; registration alone never implies a trusted host.</text>
<rect x="15" y="82" width="130" height="45" rx="8" fill="#e8f1fa" stroke="#7195b7"/>
<text x="27" y="107" font-family="Arial, sans-serif" font-size="16" fill="#18394e" font-weight="700" text-anchor="start">Operator</text>
<path d="M80,130 V595" stroke="#9bb0c1" stroke-dasharray="5 5"/>
<rect x="205" y="82" width="130" height="45" rx="8" fill="#e8f1fa" stroke="#7195b7"/>
<text x="217" y="107" font-family="Arial, sans-serif" font-size="16" fill="#18394e" font-weight="700" text-anchor="start">API / service</text>
<path d="M270,130 V595" stroke="#9bb0c1" stroke-dasharray="5 5"/>
<rect x="400" y="82" width="130" height="45" rx="8" fill="#e8f1fa" stroke="#7195b7"/>
<text x="412" y="107" font-family="Arial, sans-serif" font-size="16" fill="#18394e" font-weight="700" text-anchor="start">Trust store</text>
<path d="M465,130 V595" stroke="#9bb0c1" stroke-dasharray="5 5"/>
<rect x="590" y="82" width="130" height="45" rx="8" fill="#e8f1fa" stroke="#7195b7"/>
<text x="602" y="107" font-family="Arial, sans-serif" font-size="16" fill="#18394e" font-weight="700" text-anchor="start">Linux node</text>
<path d="M655,130 V595" stroke="#9bb0c1" stroke-dasharray="5 5"/>
<polyline points="80,165 270,165" fill="none" stroke="#426077" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="88" y="155" font-family="Arial, sans-serif" font-size="13" fill="#18394e" font-weight="400" text-anchor="start">1. Register endpoint → 201</text>
<polyline points="80,213 270,213" fill="none" stroke="#426077" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="88" y="203" font-family="Arial, sans-serif" font-size="13" fill="#18394e" font-weight="400" text-anchor="start">2. Scan presented host key</text>
<polyline points="270,252 655,252" fill="none" stroke="#426077" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="278" y="242" font-family="Arial, sans-serif" font-size="13" fill="#18394e" font-weight="400" text-anchor="start">3. Key exchange only; no authentication</text>
<polyline points="270,291 80,291" fill="none" stroke="#426077" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="88" y="281" font-family="Arial, sans-serif" font-size="13" fill="#18394e" font-weight="400" text-anchor="start">4. Return fingerprint + controller confirmation</text>
<polyline points="80,353 270,353" fill="none" stroke="#426077" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="88" y="343" font-family="Arial, sans-serif" font-size="13" fill="#18394e" font-weight="400" text-anchor="start">5. Independently compare; explicitly enroll</text>
<polyline points="270,392 655,392" fill="none" stroke="#426077" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="278" y="382" font-family="Arial, sans-serif" font-size="13" fill="#18394e" font-weight="400" text-anchor="start">6. Re-fetch; reject changed fingerprint</text>
<polyline points="270,431 465,431" fill="none" stroke="#426077" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="278" y="421" font-family="Arial, sans-serif" font-size="13" fill="#18394e" font-weight="400" text-anchor="start">7. Atomically update known_hosts</text>
<polyline points="80,489 655,489" fill="none" stroke="#426077" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="88" y="479" font-family="Arial, sans-serif" font-size="13" fill="#18394e" font-weight="400" text-anchor="start">8. Authorize controller public key manually</text>
<polyline points="80,540 270,540" fill="none" stroke="#426077" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="88" y="530" font-family="Arial, sans-serif" font-size="13" fill="#18394e" font-weight="400" text-anchor="start">9. Connectivity check → persisted observation</text>
<text x="22" y="615" font-family="Arial, sans-serif" font-size="14" fill="#365269" font-weight="400" text-anchor="start">Unknown or changed identity blocks trust; confirmation lifetime is 300 seconds.</text>
<text x="22" y="634" font-family="Arial, sans-serif" font-size="12" fill="#365269" font-weight="400" text-anchor="start">Source-derived model | arrows name requests/data, not deployment acceptance</text></svg>